name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: 'lint · typecheck · test · e2e · build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2e (Playwright)
        run: npm run e2e
      - name: Build (Vite)
        run: npm run build

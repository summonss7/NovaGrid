<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- NovaGrid: знак «сфотографированная ячейка» (novagrid-031, DESIGN-SYSTEM §5):
       кадр вырезал из таблицы одну ячейку — зелёный контур выделения (рамка на 30 %
       крупнее прежней заливки), а из углов кадра торчат оранжевые обломки линий
       соседних ячеек. Линии сетки идут по координатам рёбер ячейки, чёрная заливка
       рамки прикрывает их середины — с углов видны только короткие лучи.
       Чёрная плитка, жирные штрихи — читается в мелких иконках (16 px). -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#000000"/>
  <g stroke="#F26B21" stroke-width="6" stroke-linecap="round">
    <line x1="6" y1="12.3" x2="42" y2="12.3"/>
    <line x1="6" y1="35.7" x2="42" y2="35.7"/>
    <line x1="12.3" y1="6" x2="12.3" y2="42"/>
    <line x1="35.7" y1="6" x2="35.7" y2="42"/>
  </g>
  <rect x="12.3" y="12.3" width="23.4" height="23.4" rx="3.5" fill="#000000" stroke="#3ADF63" stroke-width="6"/>
</svg>

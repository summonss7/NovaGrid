<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- NovaGrid: знак «ячейка с продолжением линий» (novagrid-029, DESIGN-SYSTEM §5):
       зелёная ячейка в центре, оранжевые лучи продолжают её рёбра — ячейка не одна,
       из них складывается целая таблица. Чёрная плитка, жирные штрихи — читается
       в мелких иконках (16 px). -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#000000"/>
  <g stroke="#F26B21" stroke-width="6" stroke-linecap="round">
    <line x1="6" y1="24" x2="42" y2="24"/>
    <line x1="24" y1="6" x2="24" y2="42"/>
  </g>
  <rect x="15" y="15" width="18" height="18" rx="3.5" fill="#3ADF63"/>
</svg>

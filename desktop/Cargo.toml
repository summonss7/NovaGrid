[package]
name = "novagrid"
version = "1.28.0"
description = "NovaGrid — таблицы без изучения Excel (десктоп-оболочка)"
edition = "2021"

[features]
# production build: serve the frontend from the assets embedded in the exe
# (without it the window loads the devUrl — vite dev server — instead).
# scripts/desktop-build.sh passes --features custom-protocol, mirroring
# `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# =2.12.1: точная версия, проверенная связкой GNU+статический WebView2Loader
# (2.12.3 тянет из loader-архива MSVC-объекты с зависимостями от MSVC-CRT)
tauri = { version = "=2.12.1", features = [] }
# нативные диалоги «Файл → Открыть/Сохранить как» (синхронные, Windows)
rfd = "0.15.4"
# OTA из центра обновлений Aila (novagrid-036, паттерн alnavi-039): reqwest
# уже был в lock (0.13.x); native-tls = schannel — системный TLS Windows без
# openssl/C-сборки на GNU-тулчейне; sha2 и futures-util — сверка и стриминг
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
sha2 = "0.10"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
